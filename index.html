<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi mamá 🤍</title>
  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React y ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para compilar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes blob {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    .animate-blob {
      animation: blob 7s infinite;
    }
    .animate-float {
      animation-name: float;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    .animation-delay-2000 { animation-delay: 2s; }
    .animation-delay-4000 { animation-delay: 4s; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #f43f5e;
      cursor: pointer;
    }
    body { margin: 0; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function CartaMama() {
      const [isOpen, setIsOpen] = useState(false);
      const [showContent, setShowContent] = useState(false);
      
      const floatingHearts = useMemo(() => [...Array(15)].map((_, i) => ({
        id: i,
        left: `${Math.random() * 100}%`,
        width: `${Math.random() * 20 + 10}px`,
        duration: `${Math.random() * 10 + 15}s`,
        delay: `${Math.random() * 10}s`
      })), []);

      const [photos, setPhotos] = useState({ photo1: null, photo2: null, photo3: null, photo4: null, photo5: null });
      const [editingPhotoKey, setEditingPhotoKey] = useState(null);
      const [tempImageUrl, setTempImageUrl] = useState(null);
      const [editZoom, setEditZoom] = useState(1);
      const [editPos, setEditPos] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      const handleImageUpload = (e, photoKey) => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          setTempImageUrl(url);
          setEditingPhotoKey(photoKey);
          setEditZoom(1);
          setEditPos({ x: 0, y: 0 });
        }
        e.target.value = null; 
      };

      const handlePointerDown = (e) => {
        setIsDragging(true);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setDragStart({ x: clientX, y: clientY });
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = clientX - dragStart.x;
        const dy = clientY - dragStart.y;
        setEditPos(prev => ({ x: prev.x + dx, y: prev.y + dy }));
        setDragStart({ x: clientX, y: clientY });
      };

      const handlePointerUp = () => setIsDragging(false);

      const savePhotoEdit = () => {
        setPhotos(prev => ({
          ...prev,
          [editingPhotoKey]: { url: tempImageUrl, zoom: editZoom, x: editPos.x, y: editPos.y }
        }));
        setEditingPhotoKey(null);
        setTempImageUrl(null);
      };

      const cancelPhotoEdit = () => {
        setEditingPhotoKey(null);
        setTempImageUrl(null);
      };

      useEffect(() => {
        if (isOpen) {
          setTimeout(() => setShowContent(true), 600);
        }
      }, [isOpen]);

      const PhotoFrame = ({ photoKey, photoData, label, aspectClass = "aspect-square", rotateClass = "-rotate-2" }) => (
        <div className={`bg-white p-3 pb-8 md:p-4 md:pb-12 rounded-sm shadow-xl border border-gray-100 relative group w-full max-w-sm transition-transform hover:rotate-0 duration-300 ${rotateClass}`}>
          <label className={`cursor-pointer block w-full ${aspectClass} bg-rose-50 border-2 border-dashed border-rose-200 hover:border-rose-400 transition-colors flex flex-col items-center justify-center text-rose-400 overflow-hidden relative group-hover:bg-rose-100`}>
            {photoData ? (
              <div className="w-full h-full relative overflow-hidden bg-gray-900">
                <img src={photoData.url} alt="Memoria" className="absolute top-0 left-0 w-full h-full object-cover pointer-events-none" style={{ transform: `translate(${photoData.x}px, ${photoData.y}px) scale(${photoData.zoom})` }} />
                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white z-10">
                  <span className="bg-rose-500/80 px-4 py-2 rounded-full text-sm backdrop-blur-sm">Toca para cambiar</span>
                </div>
              </div>
            ) : (
              <React.Fragment>
                <svg className="w-10 h-10 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                <span className="text-sm font-medium px-4 text-center">{label}</span>
              </React.Fragment>
            )}
            <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(e, photoKey)} />
          </label>
          <svg className="absolute bottom-3 right-4 w-6 h-6 text-rose-500 opacity-80" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
          <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 w-24 h-6 bg-white/40 backdrop-blur-md shadow-sm rotate-2 border border-gray-100"></div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gradient-to-br from-[#fdfbfb] to-[#ebedee] flex items-center justify-center p-4 text-gray-800 overflow-hidden relative">
          
          <div className="fixed inset-0 overflow-hidden z-0 pointer-events-none">
            <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
            <div className="absolute top-[20%] right-[-10%] w-96 h-96 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
            <div className="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
          </div>

          <div className="fixed inset-0 z-20 pointer-events-none overflow-hidden">
            {floatingHearts.map((heart) => (
              <svg key={heart.id} className={`absolute text-rose-300 opacity-50 animate-float`} 
                   style={{ left: heart.left, top: `110%`, width: heart.width, animationDuration: heart.duration, animationDelay: heart.delay }}
                   fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
            ))}
          </div>

          <div className="z-10 w-full max-w-4xl">
            {!isOpen ? (
              <div className="flex flex-col items-center justify-center transition-all duration-1000 transform hover:scale-105 cursor-pointer" onClick={() => setIsOpen(true)}>
                <div className="relative w-80 h-56 md:w-96 md:h-64 bg-[#f8f0e6] rounded-lg shadow-2xl overflow-hidden border border-gray-200 flex items-center justify-center group">
                  <div className="absolute top-0 left-0 w-full h-full">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="w-full h-full text-[#efe3d3] drop-shadow-md"><polygon fill="currentColor" points="0,0 100,0 50,50" /></svg>
                  </div>
                  <div className="absolute top-[40%] transform -translate-y-1/2 flex flex-col items-center z-20 group-hover:scale-110 transition-transform duration-300">
                    <div className="w-14 h-14 bg-rose-500 rounded-full flex items-center justify-center shadow-lg border-2 border-rose-600">
                      <svg className="w-6 h-6 text-white animate-pulse" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
                    </div>
                    <span className="mt-8 font-serif italic text-rose-800 text-lg font-medium tracking-wide bg-white/60 px-3 py-1 rounded-full backdrop-blur-sm">Para mi mamá...</span>
                  </div>
                  <div className="absolute bottom-4 text-xs text-gray-500 uppercase tracking-widest animate-bounce">Toca para abrir</div>
                </div>
              </div>
            ) : (
              <div className={`transition-all duration-1000 ease-in-out transform ${showContent ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'}`}>
                <div className="bg-[#FFFCF9] rounded-2xl shadow-2xl p-6 md:p-12 relative overflow-hidden border border-rose-50">
                  <svg className="absolute top-0 left-0 w-32 h-32 text-rose-200 opacity-60 transform -translate-x-4 -translate-y-4" viewBox="0 0 100 100" fill="currentColor"><path d="M10,10 C30,20 20,50 50,60 C70,65 90,50 90,50 C90,50 80,80 50,90 C20,100 10,70 10,10 Z" /><circle cx="25" cy="40" r="3" /><circle cx="45" cy="25" r="4" /></svg>
                  <svg className="absolute bottom-0 right-0 w-40 h-40 text-rose-200 opacity-60 transform translate-x-8 translate-y-8 rotate-180" viewBox="0 0 100 100" fill="currentColor"><path d="M10,10 C30,20 20,50 50,60 C70,65 90,50 90,50 C90,50 80,80 50,90 C20,100 10,70 10,10 Z" /><circle cx="30" cy="50" r="5" fill="#fbcfe8" /><circle cx="60" cy="30" r="3" fill="#fbcfe8" /></svg>

                  <div className="relative z-10">
                    <h1 className="font-serif text-3xl md:text-5xl text-center text-rose-800 mb-12 leading-tight">
                      Madre hermosa, <br className="md:hidden"/> feliz Día de la Madre <span className="text-rose-400">🤍</span>
                    </h1>

                    <div className="space-y-12 text-gray-700 leading-relaxed font-serif text-base md:text-lg text-justify md:text-left">
                      <p className="md:text-center max-w-2xl mx-auto text-xl text-rose-900/90 mb-8">
                        <span className="text-4xl float-left mr-2 text-rose-400 leading-none mt-1">H</span>oy quería escribirte algo desde lo más profundo de mi corazón, porque siento que hay cosas que a veces no digo lo suficiente, y hoy más que nunca quiero que las sepas.
                      </p>

                      <div className="flex flex-col md:flex-row items-center gap-8 md:gap-12">
                        <div className="flex-1 space-y-4">
                          <p>Gracias, mamá… gracias porque a pesar de tantas cosas, de tantos momentos difíciles, de tantos errores, heridas y problemas, gracias a ti soy la persona que soy hoy en día.</p>
                          <p>Y quiero que sepas algo muy importante: <strong className="font-medium text-rose-900">no solo tus cosas lindas me hicieron crecer</strong>, también tus defectos, tus luchas, tus errores, tus caídas y todo lo que has vivido me enseñaron muchísimo. Me hicieron más fuerte, más consciente, más humana. Me enseñaron a entender que nadie tiene la vida resuelta y que detrás de cada persona hay heridas que muchas veces nadie ve.</p>
                        </div>
                        <div className="w-full md:w-2/5 flex justify-center"><PhotoFrame photoKey="photo1" photoData={photos.photo1} label="Nuestra primera foto juntas" rotateClass="rotate-2" /></div>
                      </div>

                      <div className="flex flex-col md:flex-row-reverse items-center gap-8 md:gap-12">
                        <div className="flex-1 space-y-4">
                          <p>Te admiro demasiado por todo lo que has tenido que vivir. Porque sé que tu vida no ha sido fácil y aun así tomaste la decisión de seguir adelante, de levantarte una y otra vez, de sacarnos adelante sin importar el cansancio, el dolor o los problemas que tuvieras encima.</p>
                          <p>Y eso no lo hace cualquiera. Tu esfuerzo, tu amor, tu entrega y todos los sacrificios que has hecho por nosotras son cosas que valoro muchísimo más de lo que tal vez imaginas.</p>
                        </div>
                        <div className="w-full md:w-2/5 flex justify-center"><PhotoFrame photoKey="photo2" photoData={photos.photo2} label="Una foto tuya que admiro" rotateClass="-rotate-3" /></div>
                      </div>

                      <div className="flex flex-col md:flex-row items-center gap-8 md:gap-12">
                        <div className="flex-1 space-y-4">
                          <p>Sé que no siempre hemos tenido la mejor relación del mundo. Hemos tenido diferencias, heridas, momentos muy difíciles y cosas que todavía estamos aprendiendo a sanar.</p>
                          <p>Pero incluso en medio de todo eso, nunca he dejado de amarte ni voy a hacerlo. Porque al final del día sigues siendo mi mamá, sigues siendo una de las personas más importantes de mi vida y una parte gigante de quien soy.</p>
                        </div>
                        <div className="w-full md:w-2/5 flex justify-center"><PhotoFrame photoKey="photo3" photoData={photos.photo3} label="Un recuerdo super lindo" rotateClass="rotate-1" /></div>
                      </div>

                      <div className="flex flex-col md:flex-row-reverse items-center gap-8 md:gap-12">
                        <div className="flex-1 space-y-4">
                          <p>Y aunque muchas veces el dolor pesa, también pesan muchísimo todos los recuerdos bonitos que tengo contigo. Recuerdo nuestra infancia juntas, las risas, las conversaciones, los abrazos, el cariño, las enseñanzas, los viajes, las comidas... los pequeños momentos que parecían simples pero que hoy viven dentro de mí de una forma muy especial.</p>
                          <p>Hay tantas cosas tuyas en mí… en mi forma de sentir, de pensar, de amar y hasta de ver la vida.</p>
                        </div>
                        <div className="w-full md:w-2/5 flex justify-center"><PhotoFrame photoKey="photo4" photoData={photos.photo4} label="Una aventura juntas" rotateClass="-rotate-2" /></div>
                      </div>

                      <div className="py-8 max-w-3xl mx-auto">
                        <p className="mb-6">Créeme que con el tiempo he aprendido a entenderte más. A ponerme en tu lugar. A ver más allá de los errores y entender que tú también has estado aprendiendo a vivir, a sanar y a ser mamá mientras cargabas tus propias heridas. Y honestamente eso me ha ayudado muchísimo a perdonar, a sanar y a amarte de una forma más consciente y más real.</p>
                        <p className="p-6 md:p-8 bg-rose-50/70 rounded-xl italic text-rose-900 border-l-4 border-rose-300 text-center md:text-left text-lg shadow-sm">"Porque a pesar de todo, tú amas. Tú estás. Tú intentas. Tú cambias, mejoras y haces lo mejor que puedes desde lo que eres y desde lo que la vida te ha permitido aprender. Y eso tiene muchísimo valor para mí."</p>
                      </div>

                      <div className="flex flex-col md:flex-row items-center gap-8 md:gap-12 border-t border-rose-100 pt-10">
                        <div className="flex-1 space-y-4">
                          <p>De verdad gracias, mamita linda, por cada sacrificio, por cada esfuerzo silencioso, por cada vez que pusiste nuestras vidas antes que la tuya. Gracias por seguir aquí incluso en los momentos más difíciles. Gracias por amarnos como sabes hacerlo.</p>
                          <p className="font-medium text-rose-800 text-xl mt-4">Quiero que nunca dudes de algo: te amo muchísimo.</p>
                          <p>Más de lo que a veces logro demostrar. Eres mi mamá, mi amiga, mi confidente y una parte demasiado importante de mi corazón. Y aunque sigamos creciendo, aprendiendo y sanando juntas, siempre voy a querer verte bien, feliz y en paz.</p>
                        </div>
                        <div className="w-full md:w-1/2 flex justify-center">
                          <PhotoFrame photoKey="photo5" photoData={photos.photo5} label="Nuestra foto favorita de las dos" aspectClass="aspect-video" rotateClass="rotate-0 hover:scale-105" />
                        </div>
                      </div>
                    </div>

                    <div className="mt-16 text-center">
                      <p className="text-gray-600 italic mb-4">Espero que hoy te sientas muy amada, porque de verdad mereces todo el amor bonito del mundo.</p>
                      <h2 className="font-serif text-3xl text-rose-800 font-bold">Feliz Día de la Madre 🤍</h2>
                    </div>
                    
                    <div className="mt-12 text-center pb-4">
                      <button onClick={() => { setShowContent(false); setTimeout(() => setIsOpen(false), 500); }} className="text-sm font-medium text-gray-400 hover:text-rose-500 transition-colors px-6 py-2 rounded-full hover:bg-rose-50 border border-transparent hover:border-rose-100">
                        Volver a guardar en el sobre
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>

          {editingPhotoKey && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
              <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md animate-fade-in flex flex-col items-center">
                <h3 className="text-xl font-serif text-rose-800 mb-4 font-bold">Acomoda tu foto</h3>
                <p className="text-sm text-gray-500 mb-4 text-center">Arrastra la imagen para moverla y usa la barra para acercarla o alejarla.</p>
                <div className={`w-full overflow-hidden bg-gray-100 rounded-lg cursor-move border-2 border-rose-200 ${editingPhotoKey === 'photo5' ? 'aspect-video' : 'aspect-square'}`} onMouseDown={handlePointerDown} onMouseMove={handlePointerMove} onMouseUp={handlePointerUp} onMouseLeave={handlePointerUp} onTouchStart={handlePointerDown} onTouchMove={handlePointerMove} onTouchEnd={handlePointerUp}>
                  <div className="w-full h-full flex items-center justify-center">
                    <img src={tempImageUrl} alt="Editando" className="max-w-none pointer-events-none" style={{ transform: `translate(${editPos.x}px, ${editPos.y}px) scale(${editZoom})`, transformOrigin: 'center center', willChange: 'transform' }} />
                  </div>
                </div>
                <div className="w-full mt-6 space-y-4">
                  <div className="flex items-center gap-4">
                    <span className="text-gray-400"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"></path></svg></span>
                    <input type="range" min="0.5" max="3" step="0.05" value={editZoom} onChange={(e) => setEditZoom(parseFloat(e.target.value))} className="w-full h-2 bg-rose-200 rounded-lg appearance-none cursor-pointer accent-rose-500" />
                    <span className="text-gray-400"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg></span>
                  </div>
                  <div className="flex gap-3 mt-6">
                    <button onClick={cancelPhotoEdit} className="flex-1 py-3 px-4 rounded-lg font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 transition-colors">Cancelar</button>
                    <button onClick={savePhotoEdit} className="flex-1 py-3 px-4 rounded-lg font-medium text-white bg-rose-500 hover:bg-rose-600 shadow-md transition-colors">Aplicar foto</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CartaMama />);
  </script>
</body>
</html>
